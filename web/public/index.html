<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - UniversalWare</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.8rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #e2e8f0;
            font-weight: 600;
        }
        tr:hover {
            background-color: #273548;
        }
        .price {
            color: #4ade80;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Catálogo de Productos</h1>
        <table id="productos-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Marca</th>
                    <th>Precio Venta</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <tr>
                    <td colspan="4" class="loading">Cargando datos desde el servidor...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function cargarProductos() {
            try {
                // Realiza la petición a Nginx, que la redirige a tu backend en Lua (puerto 8081)
                const response = await fetch('/api/productos');
                if (!response.ok) throw new Error('Error al obtener los datos');
                
                const productos = await response.json();
                const tbody = document.getElementById('tabla-body');
                tbody.innerHTML = '';

                if (!productos || productos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="loading">No hay productos registrados.</td></tr>';
                    return;
                }

                // Ordenamos los productos por id_producto de forma ascendente
                productos.sort((a, b) => a.id_producto - b.id_producto);

                productos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.id_producto}</td>
                        <td>${p.producto}</td>
                        <td>${p.marca}</td>
                        <td class="price">$${parseFloat(p.precio_venta).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('tabla-body').innerHTML = `
                    <tr><td colspan="4" class="loading" style="color: #f87171;">Error al conectar con el servidor backend.</td></tr>
                `;
            }
        }

        // Cargar al iniciar la página
        cargarProductos();
    </script>
</body>
</html>
