<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniversalWare - Dark Kitchen Panel</title>
    <!-- Estilos CSS Puros Nativos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Título principal -->
        <h1 class="main-title">Panel de Control - Dark Kitchen</h1>

        <!-- Botones de navegación / Selección de tablas -->
        <div class="nav-recursos" id="nav-recursos">
            <button onclick="seleccionarRecurso('marcas')" id="btn-marcas" class="btn-nav btn-nav-active">Marcas</button>
            <button onclick="seleccionarRecurso('categorias')" id="btn-categorias" class="btn-nav btn-nav-inactive">Categorías</button>
            <button onclick="seleccionarRecurso('productos')" id="btn-productos" class="btn-nav btn-nav-inactive">Productos</button>
            <button onclick="seleccionarRecurso('ingredientes')" id="btn-ingredientes" class="btn-nav btn-nav-inactive">Ingredientes</button>
            <button onclick="seleccionarRecurso('recetas')" id="btn-recetas" class="btn-nav btn-nav-inactive">Recetas</button>
            <button onclick="seleccionarRecurso('clientes')" id="btn-clientes" class="btn-nav btn-nav-inactive">Clientes</button>
            <button onclick="seleccionarRecurso('repartidores')" id="btn-repartidores" class="btn-nav btn-nav-inactive">Repartidores</button>
            <button onclick="seleccionarRecurso('pedidos')" id="btn-pedidos" class="btn-nav btn-nav-inactive">Pedidos</button>
            <button onclick="seleccionarRecurso('detalle_pedidos')" id="btn-detalle_pedidos" class="btn-nav btn-nav-inactive">Detalle de pedidos</button>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="card-container">
            <div class="card-header">
                <h2 id="titulo-tabla" class="table-title">Catálogo de Marcas</h2>
                <button onclick="abrirModalCrear()" class="btn-create">+ Nuevo Registro</button>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr id="tabla-head"></tr>
                    </thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
            <div id="mensaje-estado" class="status-message">Cargando datos. . .</div>
        </div>
    </div>

    <!-- Modal CRUD (Crear / Editar) -->
    <div id="modal-form" class="modal-backdrop modal-hidden">
        <div class="modal-content">
            <h3 id="modal-titulo" class="modal-title">Nuevo Registro</h3>
            <form id="crud-form" onsubmit="guardarRegistro(event)">
                <div id="form-fields" class="form-fields-container"></div>
                <div class="modal-actions">
                    <button type="button" onclick="cerrarModal()" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-create">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
